name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build
        run: |
          x86_64-w64-mingw32-windres -I res res/app.rc -O coff -o app.res
          x86_64-w64-mingw32-gcc -O2 -mwindows -o FlowTask.exe src/main.c app.res -static -lcomctl32 -lcomdlg32 -lmsimg32 -lwinmm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowTask
          path: FlowTask.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FlowTask.exe
